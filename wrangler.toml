"$schema" = "./node_modules/wrangler/config-schema.json"
name = "news-site"
main = ".open-next/worker.js"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

# Exposed to the Worker as plain strings (see `populateProcessEnv` in OpenNext worker init).
# Used by `db/client` HTTP fallback when Drizzle talks to D1 via the Cloudflare API.
# Set the token as a secret (never commit): `pnpm exec wrangler secret put CLOUDFLARE_D1_TOKEN`
[vars]
CLOUDFLARE_ACCOUNT_ID = "e2f9e8d1485dce72d1a18307ed32a47a"
CLOUDFLARE_DATABASE_ID = "2da1adf6-5917-41f3-b473-c79d8e5c789c"
# Public base URL for the R2 bucket `news` (r2.dev domain). Used to build image URLs.
R2_PUBLIC_URL = "https://pub-22db16bb70fb414aafa322450d8bf3c1.r2.dev"
# Avoid Next.js dynamic `require()` of `middleware-manifest.json` in the Workers runtime (opennextjs/opennextjs-cloudflare#1232).
NEXT_PRIVATE_MINIMAL_MODE = "1"
# Cheapest OpenRouter model (OpenRouter picks the provider).
OPENROUTER_MODEL = "deepseek/deepseek-v4-flash"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "news-site"
database_id = "2da1adf6-5917-41f3-b473-c79d8e5c789c"
migrations_dir = "db/migrations"
remote = true

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "news"


