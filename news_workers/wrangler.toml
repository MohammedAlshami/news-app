name = "news-latest"
main = "src/index.ts"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat"]

[triggers]
# write every 10 min; cluster and a rotating scrape slice are offset by 3 and 6 minutes (see src/index.ts)
crons = ["*/10 * * * *", "3-59/10 * * * *", "6-59/10 * * * *"]

[[services]]
binding = "NEWS_SITE"
service = "news-site"

[[d1_databases]]
binding = "DB"
database_name = "news-site"
database_id = "2da1adf6-5917-41f3-b473-c79d8e5c789c"
remote = true
